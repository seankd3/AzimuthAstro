[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azimuthastro"
version = "0.1.0"
description = "Untracked wide-field nightscape stacking: stars over a frozen ground, trails, timelapses"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "astropy", "opencv-python", "tifffile", "pillow", "lensfunpy", "rawpy"]

[project.scripts]
azastro = "azastro:main"

[tool.setuptools]
py-modules = ["azastro"]
